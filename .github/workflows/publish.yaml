name: Upload Python Package to PyPI

on:
  release:
    types: [published]

jobs:
  pypi-publish:
    name: Upload release to PyPI
    runs-on: ubuntu-latest
    
    # Questo environment deve combaciare con quello impostato su PyPI al passaggio 1
    environment:
      name: pypi
      url: https://pypi.org/p/baorecon
      
    permissions:
      id-token: write  # FONDAMENTALE: permette l'autenticazione OIDC senza password
      contents: read
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          
      - name: Install build dependencies
        run: python -m pip install build
        
      - name: Build wheel and source distribution
        run: python -m build
        
      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
