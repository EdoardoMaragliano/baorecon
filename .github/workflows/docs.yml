name: Build and Deploy Docs

on:
  push:
    branches:
      - main  # Si attiva quando fai il push sulla branch principale

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Installa dipendenze
        run: |
          pip install sphinx sphinx-rtd-theme
          pip install .  # Installa il tuo pacchetto per permettere a sphinx di leggere le docstrings

      - name: Genera documentazione HTML
        run: |
          sphinx-build -b html docs/ docs/_build/html

      - name: Pubblica su GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/_build/html