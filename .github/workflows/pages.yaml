name: Sphinx Docs to GitHub Pages

on:
  push:
    branches: ["main"]  # O il nome del tuo branch principale

# Permessi necessari per pubblicare su Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          
      - name: Install dependencies
        run: |
          # pyproject.toml is the single source of truth for dependencies.
          pip install -e .[docs]
          
      - name: Build HTML
        run: |
          cd docs
          make html
          
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build/html/  # <-- Questa è la cartella magica che hai generato tu prima!

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4