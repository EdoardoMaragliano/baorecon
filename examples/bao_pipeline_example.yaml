# configuration file for BAOReconstruction pipeline

########################################
## Paths to the data and random catalogs
########################################
catalog:
  data_path: "/path/to/data_catalog.fits"
  random_path: "/path/to/random_catalog.fits"
  data_hdu: 1
  random_hdu: 1

########################################
## Fits columns to be read
########################################
columns:
  coordinates:
    ra: "RA"
    dec: "DEC"
    redshift: "REDSHIFT"
  weights:
    data: "WEIGHT"
    random: "WEIGHT"
  ids:
    data: null
    random: null
  keep_cols:
    - "RA"
    - "DEC"
    - "REDSHIFT"
    - "WEIGHT"
    
########################################
## Coordinate system and units
########################################
coordinate_system:
  input: "ra_dec_z"
  frame: "icrs"
  ra_dec_unit: "deg"
  distance_unit: "Mpc/h"

#########################################
## Cosmological parameters
#########################################
cosmology:
  H0: 67.11
  Om0: 0.3175
  Ob0: 0.049
  Tcmb0: 2.7255
  name: "Planck18-like"

reconstruction:
  redshift: 0.55
  RSDspace: "RealSpace"
  nmesh: 256
  boxsize: null
  boxcentre: null
  padding: 100.0
  los: null
  R_sm: 15.0
  pbc: true
  rectype: "rec-sym"
  f: 0.88
  bias: 1.7
  MAS: "CIC"
  threshold_randoms: 0.7
  solver_type: "ifft"
  n_iterations: 3

masking:
  apply_mask: false

#####################################
## Output folder for rec catalogs
#####################################
output:
  folder: "/path/to/output_folder"
  naming_pattern: "rec_{name}_{solver}_n{nmesh}_z{z0:.2f}"
  save_metadata: true

catalog_name: "sample_survey"
