# configuration file for BAOReconstruction pipeline

########################################
## Paths to the data and random catalogs
########################################
catalog:
  data_path: "/path/to/data_catalog.fits"
  random_path: "/path/to/random_catalog.fits"
  data_hdu: 1
  random_hdu: 1
  # Optional. Input format: "fits" or "parquet". If omitted it is inferred
  # from the file extension (.fits/.fit -> fits, .parquet/.pq -> parquet).
  # format: fits

########################################
## Fits columns to be read
########################################
columns:
  coordinates:
    ra: "RA"
    dec: "DEC"
    redshift: "REDSHIFT"
    # The randoms may spell their coordinates differently -- observed data
    # against randoms written to another convention. Omit the block, or any key
    # in it, to inherit the names above.
    # random:
    #   ra: "RIGHT_ASCENSION"
    #   dec: "DECLINATION"
    #   redshift: "SPE_Z"
  weights:
    data: "WEIGHT"
    random: "WEIGHT"
  ids:
    data: null
    random: null
  # Columns propagated to the output catalog. When non-empty this ALSO drives
  # column pruning on read: only these columns (plus the coordinate/weight/id
  # columns above) are loaded from disk, which saves I/O and RAM on large
  # catalogs. Leave empty to read every column (legacy behaviour).
  keep_cols:
    - "RA"
    - "DEC"
    - "REDSHIFT"
    - "WEIGHT"
    
########################################
## Coordinate system and units
########################################
coordinate_system:
  # "ra_dec_z" (default): the columns above are observed sky coordinates and are
  # converted through `cosmology` on the way in and back on the way out.
  # "cartesian": they already are x/y/z -- no conversion either way, and
  # ra_dec_unit / distance_unit are ignored. Output stays Cartesian.
  input: "ra_dec_z"
  ra_dec_unit: "deg"
  distance_unit: "Mpc/h"

#########################################
## Cosmological parameters
#########################################
cosmology:
  H0: 67.11
  Om0: 0.3175
  Ob0: 0.049
  Tcmb0: 2.7255
  name: "Planck18-like"

# Background parameters beyond the five create_cosmology takes. Reconstruction
# never reads them -- it asks the background only for a comoving distance -- so
# this block is optional. It is here for codes layered on top that need more,
# such as the linear power spectrum behind a growth rate. The INI front-end
# fills it from the 2PCF [Cosmology] block, which carries these keys already.
cosmology_extra:
  Omega_r: 0.0
  Omega_L: 0.6825
  Omega_k: 0.0
  ns: 0.96
  sigma8: 0.83
  w0: -1.0
  N_eff: 3.03
  h: 0.6711

reconstruction:
  redshift: 0.55
  RSDspace: "RedshiftSpace"
  nmesh: 256          # scalar (cubic) or [Nx, Ny, Nz] (anisotropic)
  # cellsize: 8.0     # alternative to nmesh/boxsize: derive a multigrid-friendly
                      # per-axis grid from a target cell size (mutually exclusive
                      # with nmesh and boxsize)
  boxsize: null       # scalar (cubic) or [Lx, Ly, Lz] (rectangular)
  boxcentre: null
  padding: 100.0
  los: null
  R_sm: 15.0
  # Mutually exclusive with a non-zero `padding` above: periodic BCs describe a
  # cubic simulation box, not the padded survey geometry configured here.
  pbc: false
  # Rotate the catalogue so the survey's mean line of sight lies along z before
  # solving, and rotate the reconstructed positions back afterwards. Leaves the
  # cone centred on the axis, so its bounding box -- and therefore the mesh it
  # needs -- is much smaller. A local line of sight (los: null) is unaffected,
  # being equivariant under rotation.
  align_cone: false
  rectype: "rec-sym"
  f: 0.88
  bias: 1.7
  MAS: "CIC"
  threshold_randoms: 0.7
  solver_type: "ifft"     # or multigrid
  # n_iterations: 3
  # Working floating-point precision for catalogs and mesh: "float32" (default)
  # or "float64". float32 roughly halves memory use; float64 is opt-in.
  # dtype: float32
  # Compute backend for the density field and "ifft" solver: "cpu" or "gpu".
  # "gpu" requires CuPy and a CUDA-enabled GPU, and is not supported by the
  # "multigrid" solver_type (it always runs on CPU regardless of this setting).
  device: "cpu"

masking:
  apply_mask: false

#####################################
## Output folder for rec catalogs
#####################################
output:
  folder: "/path/to/output_folder"
  naming_pattern: "rec_{name}_{solver}_n{nmesh}_z{z0:.2f}"
  # Output catalog format: "fits" (default) or "parquet".
  format: fits
  save_metadata: true
  # FITS only. Build the output against an existing file's schema instead of
  # writing the frame as it stands, inheriting its column order, TFORM, TUNIT,
  # TDIM, non-structural header keywords, primary HDU and every other HDU.
  # CHECKSUM/DATASUM describe the data, so they are recomputed, and only for a
  # template that carried them.
  #   none (default)  no template
  #   input           each tracer against the catalogue it was read from
  #   <path>          one explicit file, for both tracers
  # template: input
  # What to do when the output and the template disagree on the column set.
  # false (default) appends what the template lacks and fills what the frame
  # does not supply; true makes either an error -- for a product that has to
  # stay substitutable for its input. Row counts are never constrained.
  # template_strict: false
  # Control which artifacts to save. If omitted, defaults to ['catalogs'].
  # Multiple options can be active at the same time by uncommenting them.
  save:
    - catalogs              # (Default) Reconstructed FITS catalogs.
    # - tracer_displacements  # Adds S_X, S_Y, S_Z columns to the FITS catalogs.
    # - grid_density          # Overdensity field (delta) on the grid (FITS image).
    # - grid_potential        # Scalar potential (phi) on the grid (FITS image).
    # - grid_displacement     # Displacement field (psi) on the grid (FITS image).
    # - reconstructor_object  # The full BAOReconstructor object (pickle file for debugging).

catalog_name: "sample_survey"
