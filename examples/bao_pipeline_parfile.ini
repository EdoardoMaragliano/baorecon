# =============================================================================
# BAO reconstruction pipeline -- INI parameter file
#
# Section layout mirrors the 2PCF/Euclid parfile so that one file carries the
# blocks both codes need. baorecon is meant to be integrated into the Euclid
# pipeline and to look like Euclid code from the outside, so where a block is
# SHARED with the 2PCF parfile it keeps the 2PCF spelling verbatim and the
# loader translates -- the Python-side names never leak into this file.
#
# USAGE: hand this file to the pipeline exactly like the YAML one --
#   python examples/run_bao_pipeline.py my_parfile.ini
# ReconstructionPipeline dispatches on the extension via CatalogConfig.from_file
# (baorecon/io/config.py). examples/bao_pipeline_example.yaml is the equivalent
# run in the native YAML format; tests/test_config_ini.py asserts the two stay
# equivalent.
#
# SCOPE: no key the pipeline consumes is missing. The converse does not hold in
# [Cosmology], which is copied verbatim from the 2PCF parfile so the two codes
# can share one block: several of its keys are inert for baorecon (see the note
# on that section). Everywhere else every key is actually consumed.
#
# Two settings the YAML example used to carry are deliberately ABSENT, because
# nothing reads them and exposing them would promise behaviour that does not
# exist:
#   * coordinate_system.frame  -- there is no frame conversion to configure.
#                                 radec_z_to_xyz / xyz_to_radec_z do a direct
#                                 spherical <-> Cartesian transform on RA/DEC in
#                                 numpy; no SkyCoord is involved. Input
#                                 coordinates are assumed to be already in the
#                                 frame you want. The dead `frame` parameter has
#                                 been dropped from both signatures.
#   * masking.apply_mask       -- CatalogConfig stores the block, no pipeline reads it
# Masking is applied programmatically via ReconstructionPipeline.apply_mask().
#
# INI CONVENTIONS (configparser yields strings only; the loader must coerce):
#   booleans  ->  true / false            read with getboolean, NOT bool(str)
#   lists     ->  comma-separated         nmesh, boxsize, boxcentre, save, keep_cols
#   null      ->  key present, no value   e.g. `boxsize =`
#   '%' is never used, so configparser interpolation is a non-issue; the braces
#   in `naming_pattern` are safe.
#
# KEY CASE: configparser lower-cases option names by default, which would turn
# Hubble, Tcmb, N_eff, RSDspace, R_sm and MAS into keys that no longer match
# either the 2PCF spelling or the Python API. The loader must set
# `parser.optionxform = str` to preserve case, or map every name explicitly.
# =============================================================================


# -----------------------------------------------------------------------------
# [Catalog.Galaxy] -- data catalogue, PRE-reconstruction input.
#
# NOTE this is the *input* data catalogue. In the 2PCF `parfile_template_rec.ini`
# the same section holds the reconstruction OUTPUT ({rec_galaxy}); here it is
# what the pipeline reads.
# -----------------------------------------------------------------------------
[Catalog.Galaxy]

# Required. -> CatalogConfig.data_path
filename = /path/to/data_catalog.fits

# What coord1/coord2/coord3 below actually hold. Optional, default
# PSEUDO_EQUATORIAL. These are the Euclid/2PCF spellings -- the same values the
# pipeline stamps into the FITS `COORD` header that the LE3 parser reads.
#
#   PSEUDO_EQUATORIAL  observed sky columns (RA/DEC/redshift); converted to
#                      Cartesian through [Cosmology] and converted back on
#                      write-out.
#   CARTESIAN          the columns already are x/y/z. No conversion either way,
#                      the cosmology is not used for coordinates, and
#                      angle_units / distance_unit below are ignored. The
#                      reconstructed catalogue stays Cartesian.
#
# An unrecognised value is rejected at load time, never silently defaulted:
# reading x/y/z as degrees-and-a-redshift produces plausible nonsense rather
# than an error. The loader maps this onto its internal coordinate_system.input.
coordinates = PSEUDO_EQUATORIAL

# Required. Column names for the three coordinates, in the system named above
# (RA/DEC/REDSHIFT for PSEUDO_EQUATORIAL, the x/y/z columns for CARTESIAN).
# -> ColumnMapping.ra / .dec / .redshift
# The config holds ONE set of coordinate column names for the whole run, so
# these must match [Catalog.Random]; the loader rejects a mismatch rather than
# silently picking one.
coord1 = RA
coord2 = DEC
coord3 = REDSHIFT

# Optional, default 1. FITS HDU index; ignored for parquet.
# -> CatalogConfig.data_hdu
hdu = 1

# Optional. Weight column; leave empty for an unweighted catalogue.
# -> ColumnMapping.weight_data
weight = WEIGHT

# Optional. ID column carried through to the output; empty for none.
# -> ColumnMapping.id_data
id =

# --- Settings below are GLOBAL for the run -------------------------------
# They are declared once, here, because the config holds a single value for
# each. Do not repeat them in [Catalog.Random].

# Optional, default deg.   -> coordinate_system.ra_dec_unit
angle_units = deg
# Optional, default Mpc/h. -> coordinate_system.distance_unit
distance_unit = Mpc/h

# Optional. On-disk format of BOTH catalogues: fits or parquet.
# Inferred from the file extension when omitted. -> CatalogConfig.catalog_format
format =

# Optional. Columns propagated to the output catalogues.
# When non-empty this ALSO prunes the read: only these columns plus the
# coord/weight/id columns above are loaded from disk, which saves I/O and RAM on
# large catalogues. Leave empty to read every column (legacy behaviour).
# -> ColumnMapping.keep_cols
keep_cols = RA, DEC, REDSHIFT, WEIGHT


# -----------------------------------------------------------------------------
# [Catalog.Random] -- random catalogue, PRE-reconstruction input.
# -----------------------------------------------------------------------------
[Catalog.Random]

# Required. -> CatalogConfig.random_path
filename = /path/to/random_catalog.fits

# Required. Must be identical to [Catalog.Galaxy] (see the note there).
coord1 = RA
coord2 = DEC
coord3 = REDSHIFT

# Optional, default 1. -> CatalogConfig.random_hdu
hdu = 1

# Optional. -> ColumnMapping.weight_random
weight = WEIGHT

# Optional. -> ColumnMapping.id_random
id =


# -----------------------------------------------------------------------------
# [Cosmology] -- flat LCDM used for the redshift <-> distance conversion.
#
# SHARED BLOCK: this is the 2PCF/Euclid [Cosmology] section verbatim -- same key
# names, same spelling, same set. Copy it between the two parfiles unchanged, or
# generate both from one source. This is the block that used to be duplicated by
# hand between the .ini and the YAML, which is exactly what it exists to stop.
#
# The loader translates it; the Python-side names appear nowhere in this file:
#
#   Hubble * hubble  ->  H0       PRODUCT, not a rename: 100.0 * 0.6711 = 67.11
#                                 km/s/Mpc. `hubble` alone is the dimensionless h.
#   om_matter        ->  Om0
#   om_baryons       ->  Ob0
#   Tcmb             ->  Tcmb0
#   cosmology_ID     ->  name     label carried by the astropy object
#
# INERT for baorecon, kept so the block stays byte-identical to the 2PCF one:
#   om_vac, om_k, om_radiation, spectral_index, w_eos, N_eff, sigma8
#
# They are inert because the reconstruction only ever needs the comoving
# distance from a FlatLambdaCDM, which fixes om_vac = 1 - om_matter, om_k = 0,
# w_eos = -1 and om_radiation = 0 by construction.
#
# => The loader must VALIDATE these, not merely drop them. A parfile with
# om_k = 0.05 or w_eos = -0.9 describes a cosmology baorecon cannot represent;
# silently ignoring it yields wrong comoving distances with no warning. Refuse
# such a file, and warn when om_vac disagrees with 1 - om_matter.
#
# Massive neutrinos have no 2PCF key and are therefore not expressible here:
# the cosmology is built massless. N_eff is NOT the same thing and is ignored.
# -----------------------------------------------------------------------------
[Cosmology]

cosmology_ID = LCDM

# Total matter density. Must be in (0, 1).
om_matter = 0.3175
# Baryon density.
om_baryons = 0.049

# Hubble constant, split the 2PCF way: H0 = Hubble * hubble.
# Keep Hubble = 100.0 and put the dimensionless h in `hubble`.
Hubble = 100.0
hubble = 0.6711

# CMB temperature in K.
Tcmb = 2.7255

# --- Inert for baorecon: must stay consistent with flat LCDM (see above). ---
om_vac = 0.6825
om_k = 0.0
om_radiation = 0.0
w_eos = -1.0
spectral_index = 0.96
N_eff = 3.03
sigma8 = 0.83


# -----------------------------------------------------------------------------
# [Recon] -- reconstruction parameters. All optional; defaults shown.
# -----------------------------------------------------------------------------
[Recon]

# Effective redshift of the sample. Used ONLY to fill {z0} in the output
# naming_pattern -- it is not passed to the reconstructor, and f/bias below
# carry the actual redshift dependence.
redshift = 0.55

# RealSpace or RedshiftSpace. In RealSpace no RSD term is added to the
# displacement.
RSDspace = RedshiftSpace

# Grid resolution. `nmesh` and `cellsize` are MUTUALLY EXCLUSIVE.
# nmesh: a scalar (cubic grid) or three comma-separated ints (anisotropic).
# Defaults to 256 when both nmesh and cellsize are omitted.
nmesh = 256
# cellsize: target cell size in Mpc/h; the per-axis grid is derived from the
# catalogue extent. Leave empty to use nmesh.
cellsize =

# Box geometry. Empty means "derive from the catalogue extent".
# boxsize:   scalar (cubic) or three comma-separated floats (rectangular).
# boxcentre: three comma-separated floats.
boxsize =
boxcentre =

# Padding added around the catalogue extent, in Mpc/h. Default 0.0.
padding = 100.0

# Line of sight: an axis name (x/y/z) for plane-parallel, or empty for the
# per-tracer radial (local) LOS. Default z.
los =

# Gaussian smoothing radius in Mpc/h. Default 15.0.
R_sm = 15.0

# Periodic boundary conditions. False is the right default for pipeline mode,
# which targets lightcones/survey geometries rather than cubic simulation boxes.
# MUTUALLY EXCLUSIVE with padding: format_padding() rejects pbc = true together
# with a non-zero padding, so flipping this to true means zeroing padding too.
pbc = false

# Rotate the catalogue so the survey's mean line of sight lies along z before
# solving, and rotate the reconstructed positions back afterwards. This leaves
# the cone centred on the axis instead of wherever the survey happens to point,
# so its bounding box -- and therefore the mesh needed to resolve it -- is much
# smaller. A local line of sight (los empty) is unaffected: it rotates with the
# tracers. The rotation matrix is written into the metadata sidecar, which the
# saved grids need since they live in the rotated frame.
# -> CatalogConfig.reconstruction["align_cone"]
align_cone = false

# rec-sym (shift data and randoms) or rec-iso (shift randoms only).
rectype = rec-sym

# Growth rate f(z_eff). Default 0.88.
f = 0.88

# Linear tracer bias. Default 1.0.
bias = 1.7

# Mass assignment scheme: NGP, CIC, TSC or PCS. Default CIC.
MAS = CIC

# Randoms below this density threshold are discarded. Default 0.7.
threshold_randoms = 0.7

# ifft (FFT Zel'dovich) or multigrid. Default ifft.
solver_type = ifft

# Burden iterations for the ifft solver. Default 3.
n_iterations = 3

# cpu or gpu. gpu requires CuPy and a CUDA device, and is NOT supported by
# solver_type = multigrid (which always runs on CPU). Default cpu.
device = cpu

# Working precision for catalogues and mesh: float32 or float64.
# float32 roughly halves memory use; float64 is opt-in. Default float32.
dtype = float32


# -----------------------------------------------------------------------------
# [Output]
# -----------------------------------------------------------------------------
[Output]

# Optional, default the current directory. -> output.folder
folder = /path/to/output_folder

# Optional. Sample label; fills {name} in naming_pattern, defaults to "catalog".
# -> CatalogConfig.catalog_name (top-level in the YAML form)
catalog_name = sample_survey

# Optional, default "rec_{name}_{solver}". Available placeholders:
#   {name} {solver} {nmesh} {boxsize} {z0} {H0} {Om0}
# {z0}, {H0} and {Om0} accept format specs, e.g. {z0:.2f}.
naming_pattern = rec_{name}_{solver}_n{nmesh}_z{z0:.2f}

# Optional, default fits. Output catalogue format: fits or parquet.
format = fits

# Optional, default true. Writes a *_metadata.txt sidecar with the run config.
save_metadata = true

# Optional, default `catalogs`. Comma-separated; any combination of:
#   catalogs              reconstructed catalogues
#   tracer_displacements  adds S_X, S_Y, S_Z columns to the catalogues
#   grid_density          overdensity field delta on the grid (FITS image)
#   grid_potential        scalar potential phi on the grid (FITS image)
#   grid_displacement     displacement field psi on the grid (FITS image)
#   reconstructor_object  full BAOReconstructor pickle (debugging; keeps every
#                         grid alive, so it defeats the memory-release path)
save = catalogs
